name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hisaab
          # A throwaway container that lives only for this job. Not a secret.
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hisaab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @hisaab/dashboard build
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://hisaab:ci-only@localhost:5433/hisaab_test
