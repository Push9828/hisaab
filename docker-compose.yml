# Local Postgres for development and db tests. Not used in production.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hisaab
      POSTGRES_PASSWORD: hisaab
      POSTGRES_DB: hisaab_dev
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
